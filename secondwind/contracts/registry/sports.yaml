# Our sport codes and how each source names them. Unknown vendor types map to "other" and keep
# the vendor name in sessions.sport_vendor.
sports:
  - {code: run,            mappings: {garmin: [running, treadmill_running, trail_running, track_running, street_running, obstacle_run], fit: [running]}}
  - {code: bike,           mappings: {garmin: [cycling, indoor_cycling, road_biking, mountain_biking, gravel_cycling, virtual_ride], fit: [cycling]}}
  - {code: swim,           mappings: {garmin: [lap_swimming, open_water_swimming], fit: [swimming]}}
  - {code: walk,           mappings: {garmin: [walking], fit: [walking]}}
  - {code: hike,           mappings: {garmin: [hiking, mountaineering], fit: [hiking]}}
  - {code: strength,       mappings: {garmin: [strength_training], fit: [training]}}
  - {code: cardio_machine, mappings: {garmin: [elliptical, indoor_cardio, rowing_v2, indoor_rowing], fit: [fitness_equipment]}}
  - {code: mobility,       mappings: {garmin: [yoga, pilates, breathwork]}}
  - {code: combat,         mappings: {garmin: [boxing]}}
  - {code: other,          mappings: {garmin: [dance, boating_v2, e_sport, other]}}
